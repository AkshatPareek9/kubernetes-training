kind: VerticalPodAutoscaler
apiVersion: autoscaling.k8s.io/v1
metadata:
  name: vpa
  namespace: nginx

spec:
  targetRef:
    kind: Deployment
    name: nginx-deployment
    apiVersion: apps/v1
  updatePolicy:
    updateMode: "Auto"      # { Off [no autoscale] | Auto [autoscale] | Initial [starting value defined] }
