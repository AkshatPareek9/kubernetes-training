kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: nginx-notes-app-nginx
  namespace: nginx

spec:
  rules:
  - http:
      paths:
        - pathType: Prefix
          path: /nginx
          backend:
            service:
              name: nginx-service
              port:
                number: 80

        - pathType: Prefix
          path: /notes-app
          backend:
            service:
              name: notes-app-service
              port:
                number: 8000
