kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v2
metadata:
  name: hpa
  namespace: nginx
spec:
  scaleTargetRef:
    kind: Deployment
    name: nginx-deployment
    apiVersion: apps/v1

  miniReplicas: 1
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 5
