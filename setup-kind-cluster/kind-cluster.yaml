kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
metadata:
  name: my-kind-cluster
  labels:
    purpose: development
nodes:
  - role: control-plane
    image: kindest/node:v1.28.0
  - role: worker
    image: kindest/node:v1.28.0
  - role: worker
    image: kindest/node:v1.28.0
  - role: worker
    image: kindest/node:v1.28.0
    extraPortMappings:
    - containerPort: 80
      hostPort: 8080
      protocol: TCP
    - containerPort: 443
      hostPort: 443
      protocol: TCP
